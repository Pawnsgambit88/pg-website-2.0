# Railway / Nixpacks build configuration for the Django backend.
# Nixpacks reads .python-version for the interpreter; this file pins the install
# and release phases so Railway does not guess.

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
# The `web` process from the Procfile.  Railway overrides this per-service
# (worker → `python manage.py run_worker`,
#  scheduler → `python manage.py run_scheduler`).
cmd = "gunicorn pgchess.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
